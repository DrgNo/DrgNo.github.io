<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="./fav-con/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="./fav-con/favicon.svg" />
<link rel="shortcut icon" href="./fav-con/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="./fav-con/apple-touch-icon.png" />
<link rel="manifest" href="./fav-con/site.webmanifest" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-center">
    <div class="card auth-card">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">Portal<span class="accent"> Entry</span></span>
      </div>
      <p class="subtitle">Welcome to the internal batch portal. Enter your credentials to continue</p>
      
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" placeholder="as2025xxxxx@sci.sjp.ac.lk">

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">

        <button type="submit" id="login-btn">Sign in</button>
      </form>

      <p id="error-msg" class="error-msg" hidden></p>
      <p class="fine-print">Authorized access only. Account credentials are issued directly by the batch representative.</p>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
