<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>We've moved — Batch Portal</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://japurafood.edu.lk/">
<meta name="theme-color" content="#0A0F1E">
<style>
  :root { --bg:#0A0F1E; --panel:#121A2E; --line:#1F2C47; --text:#E7ECF6; --muted:#8E9BB8; --blue:#4C8DFF; --violet:#8B5CF6; --ok:#4ADE9C; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: grid; place-items: center; padding: 20px; overflow: hidden;
    padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: max(20px, env(safe-area-inset-bottom));
  }

  /* drifting glow orbs + rising particles */
  .orb { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .55; pointer-events: none; }
  .o1 { width: 340px; height: 340px; background: #2A5AD6; top: -90px; left: -90px; animation: drift1 16s ease-in-out infinite alternate; }
  .o2 { width: 300px; height: 300px; background: #6D3FD1; bottom: -90px; right: -70px; animation: drift2 19s ease-in-out infinite alternate; }
  .o3 { width: 220px; height: 220px; background: #128572; top: 55%; left: 55%; opacity: .3; animation: drift1 22s ease-in-out infinite alternate-reverse; }
  .spark { position: fixed; bottom: -12px; border-radius: 50%; background: var(--blue); opacity: 0; pointer-events: none;
           animation: rise var(--d) linear var(--delay) infinite; }

  .card {
    position: relative; width: 100%; max-width: 440px; text-align: center;
    background: color-mix(in srgb, var(--panel) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 22px; padding: 34px 26px 26px;
    box-shadow: 0 24px 70px rgba(0,0,0,.45);
    animation: cardIn .7s cubic-bezier(.2,.9,.3,1.2) both;
  }

  /* spinning portal ring with an arrow */
  .portal { position: relative; width: 112px; height: 112px; margin: 0 auto 18px; }
  .portal::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--blue), var(--violet), var(--ok), var(--blue));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
    animation: spin 3.2s linear infinite; }
  .portal::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 2px solid var(--blue); opacity: 0; animation: ping 2.4s ease-out infinite; }
  .portal .core { position: absolute; inset: 12px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle, #1a2a55, #0d1526); box-shadow: inset 0 0 22px rgba(76,141,255,.35); }
  .portal svg { width: 46px; height: 46px; color: #fff; animation: nudge 1.6s ease-in-out infinite; }

  h1 { font-size: 28px; line-height: 1.15; margin-bottom: 10px;
       background: linear-gradient(90deg, #fff, #9ec0ff, #c7b3ff, #fff); background-size: 250% 100%;
       -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 5s linear infinite; }
  p.sub { color: var(--muted); font-size: 15px; line-height: 1.55; }
  .rise { opacity: 0; transform: translateY(12px); animation: rise2 .55s ease forwards; animation-delay: calc(.3s + var(--i) * .13s); }

  /* old -> new */
  .from-to { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 20px 0 6px; font-size: 13px; }
  .chip { padding: 7px 11px; border-radius: 99px; border: 1px solid var(--line); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .chip.old { color: var(--muted); text-decoration: line-through; text-decoration-color: #E4626F; opacity: .75; }
  .chip.new { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 55%, transparent); box-shadow: 0 0 0 0 rgba(74,222,156,.5); animation: glow 2.2s ease-in-out infinite; }
  .flow { width: 34px; height: 4px; border-radius: 4px; background: repeating-linear-gradient(90deg, var(--blue) 0 6px, transparent 6px 12px); background-size: 12px 4px; animation: flow .7s linear infinite; }

  /* typed URL */
  .typed { display: inline-block; margin: 14px 0 20px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 19px; font-weight: 700; color: #fff;
           overflow: hidden; white-space: nowrap; border-right: 2px solid var(--blue); width: 0; max-width: 100%;
           animation: type 1.6s steps(17) .9s forwards, caret .7s step-end infinite; }

  .btn { position: relative; display: block; overflow: hidden; text-decoration: none; color: #fff; font-weight: 700; font-size: 16px;
         padding: 15px 18px; border-radius: 14px; background: linear-gradient(135deg, var(--blue), #2A5AD6);
         box-shadow: 0 10px 28px rgba(42,90,214,.45); transition: transform .15s ease; }
  .btn:active { transform: scale(.97); }
  .btn::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
                background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent); transform: skewX(-20deg); animation: sweep 2.8s ease-in-out infinite; }

  .count { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 18px; color: var(--muted); font-size: 13px; }
  .ring { width: 30px; height: 30px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 3.5; }
  .ring .bg { stroke: var(--line); }
  .ring .fg { stroke: var(--blue); stroke-linecap: round; stroke-dasharray: 88; stroke-dashoffset: 0; animation: countdown var(--secs, 10s) linear 1.2s forwards; }
  .paused .ring .fg { animation-play-state: paused; stroke: var(--muted); }
  .stay { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 13px; cursor: pointer; padding: 6px; }

  @keyframes cardIn { from { opacity: 0; transform: translateY(26px) scale(.94); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes ping { 0% { transform: scale(.85); opacity: .7; } 100% { transform: scale(1.35); opacity: 0; } }
  @keyframes nudge { 0%, 100% { transform: translateX(-3px); } 50% { transform: translateX(6px); } }
  @keyframes shimmer { to { background-position: -250% 0; } }
  @keyframes rise2 { to { opacity: 1; transform: none; } }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(74,222,156,.45); } 50% { box-shadow: 0 0 0 9px rgba(74,222,156,0); } }
  @keyframes flow { to { background-position: 12px 0; } }
  @keyframes type { to { width: 17ch; } }
  @keyframes caret { 50% { border-color: transparent; } }
  @keyframes sweep { 0% { left: -60%; } 55%, 100% { left: 130%; } }
  @keyframes countdown { to { stroke-dashoffset: 88; } }
  @keyframes drift1 { to { transform: translate(90px, 70px) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-80px, -90px) scale(1.2); } }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: .8; } 100% { transform: translateY(-105vh); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .rise, .card { opacity: 1; transform: none; }
    .typed { width: auto; border-right: 0; }
  }
</style>
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

  <main class="card" id="card">
    <div class="portal" aria-hidden="true">
      <div class="core">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 5l7 7-7 7"/></svg>
      </div>
    </div>

    <h1 class="rise" style="--i:0">We've moved to a new home!</h1>
    <p class="sub rise" style="--i:1">The Batch Portal now lives at a new address. This old site is no longer updated &mdash; please use the new one and update your bookmark.</p>

    <div class="from-to rise" style="--i:2" aria-hidden="true">
      <span class="chip old" id="oldHost">old site</span><span class="flow"></span><span class="chip new">new site</span>
    </div>

    <div class="rise" style="--i:3"><span class="typed" aria-label="japurafood.edu.lk">japurafood.edu.lk</span></div>

    <a class="btn rise" style="--i:4" id="go" href="https://japurafood.edu.lk/">Go to the new site &rarr;</a>

    <div class="count rise" style="--i:5" id="count">
      <svg class="ring" viewBox="0 0 32 32" aria-hidden="true"><circle class="bg" cx="16" cy="16" r="14"/><circle class="fg" cx="16" cy="16" r="14"/></svg>
      <span id="msg">Taking you there in <b id="sec">10</b>s…</span>
      <button class="stay" id="stay" type="button">Stay here</button>
    </div>
  </main>

<script>
(function () {
  var NEW_ORIGIN = "https://japurafood.edu.lk";
  var SECONDS = 10;

  // Keep the page the person wanted (e.g. home.html?form=123) — only a plain "name.html" is carried over,
  // and the destination origin is fixed, so this can never redirect anywhere else.
  var page = location.pathname.split("/").pop();
  var keep = /^[\w-]+\.html$/.test(page) && page !== "index.html" && page !== "404.html" ? page : "";
  var target = NEW_ORIGIN + "/" + keep + location.search + location.hash;

  var go = document.getElementById("go");
  go.href = target;
  document.getElementById("oldHost").textContent = location.hostname || "old site";
  document.getElementById("card").style.setProperty("--secs", SECONDS + "s");
  document.getElementById("count").style.setProperty("--secs", SECONDS + "s");

  // The old site's service worker (push) is no longer needed.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
  }

  // Rising sparks
  for (var i = 0; i < 16; i++) {
    var s = document.createElement("i");
    s.className = "spark";
    var size = 3 + Math.random() * 5;
    s.style.cssText = "left:" + Math.random() * 100 + "%;width:" + size + "px;height:" + size + "px;--d:" + (7 + Math.random() * 9) + "s;--delay:" + (-Math.random() * 12) + "s";
    document.body.appendChild(s);
  }

  // Auto-redirect with a cancel option
  var left = SECONDS, timer = null;
  var sec = document.getElementById("sec");
  timer = setInterval(function () {
    left--; sec.textContent = left;
    if (left <= 0) { clearInterval(timer); location.replace(target); }
  }, 1000);
  document.getElementById("stay").addEventListener("click", function () {
    clearInterval(timer);
    document.getElementById("count").classList.add("paused");
    document.getElementById("msg").textContent = "Auto-redirect stopped.";
    this.hidden = true;
  });
})();
</script>
</body>
</html>
