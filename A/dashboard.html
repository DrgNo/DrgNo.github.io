<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Portal — My Record</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand small">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Batch<span class="accent">Portal</span></span>
    </div>
    <div class="topbar-right">
      <span id="user-email" class="user-email"></span>
      <button id="logout-btn" class="ghost-btn">Sign out</button>
    </div>
  </header>

  <main class="dash-wrap">
    <div id="loading-state" class="state-msg">Loading your record…</div>
    <div id="error-state" class="state-msg error-msg" hidden></div>

    <section id="record" class="record-grid" hidden>
      <div class="card profile-card">
        <div class="profile-head">
          <div class="avatar" id="avatar-initial"></div>
          <div>
            <h1 id="f-name" class="profile-name"></h1>
            <p class="profile-sub"><span id="f-gender"></span> · <span id="f-age"></span> yrs</p>
          </div>
          <div class="points-badge">
            <span class="points-value" id="f-points">0</span>
            <span class="points-label">Total Points</span>
          </div>
        </div>
        <p class="section-label">Additional Info</p>
        <p id="f-info" class="info-text"></p>
      </div>

      <div class="card">
        <p class="section-label">Roles Assigned</p>
        <ul id="f-roles" class="pill-list"></ul>
      </div>

      <div class="card">
        <p class="section-label">Tasks</p>
        <ul id="f-tasks" class="line-list"></ul>
      </div>

      <div class="card">
        <p class="section-label">Bad Records</p>
        <ul id="f-bad" class="line-list muted-list"></ul>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
