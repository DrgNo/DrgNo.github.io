<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="./fav-con/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="./fav-con/favicon.svg" />
<link rel="shortcut icon" href="./fav-con/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="./fav-con/apple-touch-icon.png" />
<link rel="manifest" href="./fav-con/site.webmanifest" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requests</title>
<script>(function(){try{var m=localStorage.getItem("theme-mode")||"dark";var p=localStorage.getItem("theme-palette")||"blue";var d=localStorage.getItem("theme-design")||"default";document.documentElement.setAttribute("data-mode",m);document.documentElement.setAttribute("data-palette",p);document.documentElement.setAttribute("data-design",d);}catch(e){}})();</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <button id="menu-toggle" class="menu-toggle" aria-label="Open menu">☰</button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand small sidebar-brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">My<span class="accent"> Requests</span></span>
      </div>
            <nav class="side-nav">
        <a href="home.html" class="side-link">Home</a>
        <a href="dashboard.html" class="side-link">Dashboard</a>
        <a href="timetable.html" class="side-link">Timetable</a>
        <a href="requests.html" class="side-link active">Requests</a>
        <a href="fund.html" class="side-link">Fund</a>
        <button type="button" class="side-link side-submenu-toggle" id="side-more-toggle">
          <span>More</span>
          <span class="side-submenu-chevron">▾</span>
        </button>
        <div class="side-submenu" id="side-submenu">
          <a href="wall.html" class="side-link">Wall of Fame</a>
          <a href="badges.html" class="side-link">Badges</a>
          <a href="settings.html" class="side-link">Settings</a>
          <a href="admin.html" class="side-link" id="admin-nav-link" hidden>Admin</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <span id="user-email" class="user-email" hidden></span>
        <button id="logout-btn" class="ghost-btn">Sign out</button>
      </div>
    </aside>

    <main class="content-area">
      <div class="dash-wrap" id="requests-page">
        <div id="loading-state" class="state-msg">Loading…</div>
        <div id="error-state" class="state-msg error-msg" hidden></div>

        <div id="requests-content" hidden>
          <h1 class="welcome-heading" style="margin-bottom:4px;">Requests</h1>
          <p class="welcome-sub" style="margin-bottom:18px;">Ask the admins something formally — schedule checks, changes, anything — instead of a DM.</p>

          <button type="button" class="btn-primary req-new-btn" id="req-open-new">+ New Request</button>

          <p class="section-label">Pending</p>
          <div id="req-pending-list" class="req-list"></div>

          <p class="section-label" style="margin-top:6px;">Resolved</p>
          <p class="req-section-sub">Completed, rejected, or dropped requests.</p>
          <div id="req-resolved-list" class="req-list"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modal-request" hidden>
    <div class="modal-box">
      <button class="modal-close" id="req-modal-close" aria-label="Close">✕</button>
      <div class="req-modal-body">
        <p class="section-label">New Request</p>
        <form id="form-request">
          <label for="req-subject">Subject</label>
          <input type="text" id="req-subject" maxlength="80" placeholder="e.g. Is tomorrow's lecture cancelled?" required>

          <label for="req-message">Message</label>
          <textarea id="req-message" rows="4" maxlength="800" placeholder="Give the admins the details they'd need to help." required></textarea>

          <label>Who can see this</label>
          <div class="seg-toggle">
            <input type="radio" name="req-visibility" id="req-vis-public" value="public" checked>
            <label for="req-vis-public">🌐 Public</label>
            <input type="radio" name="req-visibility" id="req-vis-private" value="private">
            <label for="req-vis-private">🔒 Admins Only</label>
          </div>

          <label>How you appear</label>
          <div class="seg-toggle">
            <input type="radio" name="req-identity" id="req-id-named" value="named" checked>
            <label for="req-id-named">🙂 Show My Name</label>
            <input type="radio" name="req-identity" id="req-id-anon" value="anonymous">
            <label for="req-id-anon">🕶 Anonymous</label>
          </div>

          <button type="submit" class="btn-primary">Send Request</button>
        </form>
        <p class="error-msg" id="req-error" hidden></p>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-request-resolve" hidden>
    <div class="modal-box">
      <button class="modal-close" id="req-resolve-modal-close" aria-label="Close">✕</button>
      <div class="req-modal-body">
        <p class="section-label" id="req-resolve-title">Resolve Request</p>
        <p class="fine-print" id="req-resolve-subject" style="text-align:left; margin:0 0 16px;"></p>
        <form id="form-request-resolve">
          <input type="hidden" id="req-resolve-id">
          <input type="hidden" id="req-resolve-status">
          <label for="req-resolve-note">Note to the requester (optional)</label>
          <textarea id="req-resolve-note" rows="3" maxlength="300" placeholder="Shown publicly under the resolved request."></textarea>
          <button type="submit" class="btn-primary" id="req-resolve-submit-btn">Confirm</button>
        </form>
        <p class="error-msg" id="req-resolve-error" hidden></p>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
