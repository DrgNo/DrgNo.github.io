<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Portal — Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-center">
    <div class="card auth-card">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">Batch<span class="accent">Portal</span></span>
      </div>
      <p class="subtitle">Sign in to view your batch record. Each account only sees its own data.</p>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" placeholder="you@example.com">

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">

        <button type="submit" id="login-btn">Sign in</button>
      </form>

      <p id="error-msg" class="error-msg" hidden></p>
      <p class="fine-print">Access is issued by your batch admin. No self-registration.</p>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
