<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <button id="menu-toggle" class="menu-toggle" aria-label="Open menu">☰</button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand small sidebar-brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">Main<span class="accent"> Stage</span></span>
      </div>
      <nav class="side-nav">
        <a href="home.html" class="side-link active">Home</a>
        <a href="dashboard.html" class="side-link">Dashboard</a>
        <a href="fund.html" class="side-link">Fund</a>
        <a href="wall.html" class="side-link">Wall of Fame</a>
        <a href="settings.html" class="side-link">Settings</a>
        <a href="admin.html" class="side-link" id="admin-nav-link" hidden>Admin</a>
      </nav>
      <div class="sidebar-footer">
        <span id="user-email" class="user-email" hidden></span>
        <button id="logout-btn" class="ghost-btn">Sign out</button>
      </div>
    </aside>

    <main class="content-area">
      <div class="dash-wrap" id="home-page">
        <div id="loading-state" class="state-msg">Loading…</div>
        <div id="error-state" class="state-msg error-msg" hidden></div>

        <div id="home-content" hidden>

          <h1 class="welcome-heading" id="welcome-heading">Welcome</h1>
          <p class="welcome-sub">Here's what's happening in the batch right now.</p>

          <!-- Announcement / Notice Board -->
          <div class="card full-span" style="margin-bottom:18px;">
            <p class="section-label">Announcements</p>
            <ul class="notice-list" id="notice-list"></ul>
          </div>

          <!-- Batch Leadership -->
          <div class="card full-span" style="margin-bottom:18px;">
            <p class="section-label">Batch Leadership</p>
            <div class="leader-grid" id="leader-grid"></div>
          </div>

          <!-- Ongoing Group Projects -->
          <div class="card full-span">
            <p class="section-label">Ongoing Projects</p>
            <div class="project-grid" id="project-grid"></div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
