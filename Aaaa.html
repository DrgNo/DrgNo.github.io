<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty of Applied Sciences - Batch Portal</title>
    <style>
    body {
    font-family: Arial, sans-serif;
    background-color: #f4f7f6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 400px;
    text-align: center;
}

input {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
}

button {
    width: 100%;
    padding: 10px;
    background-color: #0056b3;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
}

button:hover {
    background-color: #004494;
}

.logout {
    background-color: #dc3545;
}

.logout:hover {
    background-color: #c82333;
}

.card {
    background: #f8f9fa;
    padding: 15px;
    border-radius: 6px;
    text-align: left;
    margin: 20px 0;
    border: 1px solid #e9ecef;
}

.error {
    color: red;
    font-size: 14px;
    margin-top: 10px;
}
</style>
</head>
<body>

    <!-- Login Section -->
    <div id="login-container" class="container">
        <h2>Batchmate Portal</h2>
        <p>Sign in with your Google account to view your details.</p>
        <button id="google-login-btn">Sign in with Google</button>
        <p id="error-msg" class="error"></p>
    </div>

    <!-- Dashboard Section (Hidden until logged in) -->
    <div id="dashboard-container" class="container" style="display: none;">
        <h2>Welcome, <span id="display-name">Student</span>!</h2>
        <div class="card">
            <h3>Your Academic Details</h3>
            <p><strong>Degree:</strong> <span id="display-degree">Loading...</span></p>
            <p><strong>Current Assignment:</strong> <span id="display-project">Loading...</span></p>
            <p><strong>Presentation Focus:</strong> <span id="display-focus">Loading...</span></p>
        </div>
        <button id="logout-btn" class="logout">Log Out</button>
    </div>

    <!-- Firebase JS Logic -->
    <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { 
    getAuth, 
    GoogleAuthProvider, 
    signInWithRedirect, 
    getRedirectResult,
    signOut, 
    onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

// Your Firebase configuration
const firebaseConfig = {
    apiKey: "AIzaSyDfgcIpOgJJeObDrWm_Ce0MuWSI7ZU0lB0",
    authDomain: "drgno-fst.firebaseapp.com",
    projectId: "drgno-fst",
    storageBucket: "drgno-fst.firebasestorage.app",
    messagingSenderId: "91216205592",
    appId: "1:91216205592:web:616c05cd40727421a2b06d"
  };

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// UI Elements
const loginContainer = document.getElementById('login-container');
const dashboardContainer = document.getElementById('dashboard-container');
const googleLoginBtn = document.getElementById('google-login-btn');
const logoutBtn = document.getElementById('logout-btn');
const errorMsg = document.getElementById('error-msg');

// Google Sign-In Button Handler
googleLoginBtn.addEventListener('click', () => {
    signInWithRedirect(auth, provider);
});

// Check for errors when returning from Google redirect
getRedirectResult(auth).catch((error) => {
    if (error) {
        console.error(error);
        errorMsg.innerText = "Login error: " + error.message;
    }
});
    

// Logout Button Handler
logoutBtn.addEventListener('click', () => {
    signOut(auth);
});

// Monitor Auth State
onAuthStateChanged(auth, async (user) => {
    if (user) {
        loginContainer.style.display = 'none';
        dashboardContainer.style.display = 'block';

        // Fetch data using the user's email address as the Document ID
        const docRef = doc(db, "batchmates", user.email);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            const data = docSnap.data();
            document.getElementById('display-name').innerText = data.name || user.displayName;
            document.getElementById('display-degree').innerText = data.degree || "N/A";
            document.getElementById('display-project').innerText = data.project_group || "N/A";
            document.getElementById('display-focus').innerText = data.focus || "N/A";
        } else {
            // User signed in with Google, but their email isn't in your database
            document.getElementById('display-name').innerText = user.displayName;
            document.getElementById('display-degree').innerText = "No record found for this email.";
            document.getElementById('display-project').innerText = "N/A";
            document.getElementById('display-focus').innerText = "N/A";
        }
    } else {
        loginContainer.style.display = 'block';
        dashboardContainer.style.display = 'none';
        errorMsg.innerText = '';
    }
});

    </script>
</body>
</html>
