<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="./fav-con/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="./fav-con/favicon.svg" />
<link rel="shortcut icon" href="./fav-con/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="./fav-con/apple-touch-icon.png" />
<link rel="manifest" href="./fav-con/site.webmanifest" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timetable</title>
<script>(function(){try{var m=localStorage.getItem("theme-mode")||"dark";var p=localStorage.getItem("theme-palette")||"blue";var d=localStorage.getItem("theme-design")||"default";document.documentElement.setAttribute("data-mode",m);document.documentElement.setAttribute("data-palette",p);document.documentElement.setAttribute("data-design",d);}catch(e){}})();</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <button id="menu-toggle" class="menu-toggle" aria-label="Open menu">☰</button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand small sidebar-brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">My<span class="accent"> Timetable</span></span>
      </div>
            <nav class="side-nav">
        <a href="home.html" class="side-link">Home</a>
        <a href="dashboard.html" class="side-link">Dashboard</a>
        <a href="timetable.html" class="side-link active">Timetable</a>
        <a href="requests.html" class="side-link">Requests</a>
        <a href="fund.html" class="side-link">Fund</a>
        <button type="button" class="side-link side-submenu-toggle" id="side-more-toggle">
          <span>More</span>
          <span class="side-submenu-chevron">▾</span>
        </button>
        <div class="side-submenu" id="side-submenu">
          <a href="wall.html" class="side-link">Wall of Fame</a>
          <a href="badges.html" class="side-link">Badges</a>
          <a href="settings.html" class="side-link">Settings</a>
          <a href="admin.html" class="side-link" id="admin-nav-link" hidden>Admin</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <span id="user-email" class="user-email" hidden></span>
        <button id="logout-btn" class="ghost-btn">Sign out</button>
      </div>
    </aside>

    <main class="content-area">
      <div class="dash-wrap" id="timetable-page">
        <div id="loading-state" class="sk-wrap" aria-busy="true" aria-label="Loading"><span class="sk sk-h1" style="width:28%;margin-bottom:16px;"></span><div class="card sk-card"><div class="sk-cal-head"><span class="sk sk-circle" style="width:36px;height:36px"></span><span class="sk" style="width:34%;height:18px"></span><span class="sk sk-circle" style="width:36px;height:36px"></span></div><div class="sk-cal-grid sk-cal-dow"><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span></div><div class="sk-cal-grid"><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span></div></div><div class="card sk-card"><span class="sk sk-title" style="width:34%"></span><div class="sk-row"><span class="sk" style="width:52px;height:38px;border-radius:8px;flex-shrink:0"></span><div class="sk-col"><span class="sk sk-line" style="width:60%;"></span><span class="sk sk-line" style="width:40%;"></span></div></div><div class="sk-row"><span class="sk" style="width:52px;height:38px;border-radius:8px;flex-shrink:0"></span><div class="sk-col"><span class="sk sk-line" style="width:60%;"></span><span class="sk sk-line" style="width:40%;"></span></div></div></div><div class="sk-tabbar"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div></div>
        <div id="error-state" class="state-msg error-msg" hidden></div>

        <div id="timetable-content" hidden>
          <h1 class="welcome-heading" id="tt-title" style="margin-bottom:16px;">Home</h1>

          <!-- HOME -->
          <section class="tt-panel" data-tab="home">
            <div class="card cal-card">
              <div class="cal-head">
                <button type="button" class="cal-nav" id="tt-cal-prev" aria-label="Previous month">‹</button>
                <div class="cal-title-wrap">
                  <span class="cal-title" id="cal-title"></span>
                  <button type="button" class="cal-today-btn" id="tt-cal-today">Today</button>
                </div>
                <button type="button" class="cal-nav" id="tt-cal-next" aria-label="Next month">›</button>
              </div>
              <div class="cal-dow"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
              <div class="cal-grid" id="cal-grid"></div>
              <div class="cal-legend"><span><i class="cal-dot cal-dot-class"></i> Lectures</span><span><i class="cal-dot cal-dot-note"></i> Notes</span></div>
            </div>

            <div class="card">
              <p class="section-label" style="margin:0 0 4px;">Today's lectures</p>
              <p class="tt-day-date" id="tt-today-date" style="margin:0 0 12px;"></p>
              <div class="tt-card-list" id="tt-today-list"></div>
            </div>
          </section>

          <!-- TIMETABLE -->
          <section class="tt-panel" data-tab="timetable" hidden>
            <div class="seg-bar" id="tt-sched-seg">
              <button type="button" class="seg-pill active" data-sub="schedule">Schedule</button>
              <button type="button" class="seg-pill" data-sub="attendance">Attendance</button>
            </div>
            <div id="tt-sub-schedule">
              <div class="seg-bar seg-bar-days" id="tt-daybar"></div>
              <p class="tt-day-heading" id="tt-day-heading"></p>
              <div class="tt-card-list" id="tt-day-list"></div>
            </div>
            <div id="tt-sub-attendance" hidden>
              <div class="attend-overall-card">
                <div class="attend-overall-value" id="attend-overall-pct">—</div>
                <div class="attend-overall-label">Overall attendance</div>
                <div class="attend-overall-sub" id="attend-overall-sub"></div>
              </div>
              <div class="attend-list" id="attend-module-list"></div>
            </div>
          </section>

          <!-- NOTES -->
          <section class="tt-panel" data-tab="notes" hidden>
            <div class="seg-bar" id="tt-notes-seg">
              <button type="button" class="seg-pill active" data-sub="notes">Notes</button>
              <button type="button" class="seg-pill" data-sub="todos">To-dos</button>
            </div>
            <div id="tt-sub-notes">
              <div class="pl-actions"><button type="button" class="pl-add-btn" id="tt-add-note">+ Add note</button></div>
              <div class="note-grid" id="tt-note-grid"></div>
            </div>
            <div id="tt-sub-todos" hidden>
              <div class="pl-actions"><button type="button" class="pl-add-btn" id="tt-add-todo">+ Add to-do</button></div>
              <div class="todo-list" id="tt-todo-list"></div>
            </div>
          </section>
        </div>
      </div>
    </main>

  <nav class="admin-tab-bar" id="tt-tabbar" role="tablist" hidden>
    <button type="button" class="admin-tab-pill active" data-tab="home">Home</button>
    <button type="button" class="admin-tab-pill" data-tab="timetable">Timetable</button>
    <button type="button" class="admin-tab-pill" data-tab="notes">Notes</button>
  </nav>

  <!-- Day popup -->
  <div class="modal-overlay" id="modal-tt-day" hidden>
    <div class="modal-box">
      <button type="button" class="modal-close" data-close-modal="modal-tt-day" aria-label="Close">✕</button>
      <div class="admin-modal-body">
        <p class="section-label" id="tt-day-modal-title"></p>
        <div id="tt-day-modal-body"></div>
        <button type="button" class="btn-primary" id="tt-day-add-note" style="margin-top:16px;">Add note</button>
      </div>
    </div>
  </div>

  <!-- Note form -->
  <div class="modal-overlay" id="modal-tt-note" hidden>
    <div class="modal-box">
      <button type="button" class="modal-close" data-close-modal="modal-tt-note" aria-label="Close">✕</button>
      <div class="admin-modal-body">
        <p class="section-label" id="tt-note-modal-title">New note</p>
        <form id="form-tt-note">
          <label for="ttn-title">Header</label>
          <input type="text" id="ttn-title" maxlength="80" required>
          <label for="ttn-body">Description</label>
          <textarea id="ttn-body" rows="4" maxlength="1000"></textarea>
          <div id="ttn-date-wrap">
            <label for="ttn-date">Date (optional)</label>
            <input type="date" id="ttn-date">
          </div>
          <label for="ttn-time">Time (optional)</label>
          <input type="time" id="ttn-time">
          <button type="submit" class="btn-primary" id="ttn-save">Save</button>
        </form>
        <button type="button" class="danger-btn" id="ttn-delete" hidden>Delete note</button>
        <p class="error-msg" id="ttn-error" hidden></p>
      </div>
    </div>
  </div>

  <!-- To-do form -->
  <div class="modal-overlay" id="modal-tt-todo" hidden>
    <div class="modal-box">
      <button type="button" class="modal-close" data-close-modal="modal-tt-todo" aria-label="Close">✕</button>
      <div class="admin-modal-body">
        <p class="section-label">New to-do</p>
        <form id="form-tt-todo">
          <label for="ttt-text">Task</label>
          <input type="text" id="ttt-text" maxlength="200" required>
          <button type="submit" class="btn-primary" id="ttt-save">Add</button>
        </form>
        <p class="error-msg" id="ttt-error" hidden></p>
      </div>
    </div>
  </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
